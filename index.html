```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi viaje 📸</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <!-- CABECERA -->
    <header class="cabecera">

        <div class="icono-viaje">
            📸
        </div>

        <h1>Mi viaje</h1>

        <p class="subtitulo">
            Mis recuerdos de este viaje
        </p>

        <div class="datos-viaje">
            <span>📅 2026</span>
            <span>📷 <span id="numeroFotos">0</span> fotos</span>
        </div>

    </header>


    <!-- GALERÍA -->
    <main>

        <section class="galeria" id="galeria">
            <!-- Las fotos se cargan automáticamente con JavaScript -->
        </section>

    </main>


    <!-- VISOR DE FOTO -->
    <div class="visor" id="visor">

        <button class="cerrar" id="cerrar">
            ×
        </button>

        <button class="flecha izquierda" id="anterior">
            ‹
        </button>

        <img id="fotoGrande" src="" alt="Fotografía del viaje">

        <button class="flecha derecha" id="siguiente">
            ›
        </button>

        <div class="contador" id="contador">
            1 / 1
        </div>

    </div>


    <!-- PIE -->
    <footer>

        <p>
            ❤️ Recuerdos de mi viaje
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
```
